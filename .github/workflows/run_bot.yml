name: Telegram Bot Runner

on:
  schedule:
    - cron: '0 8 * * *' # Spustí sa raz denne o 8:00 UTC
  workflow_dispatch: # Umožňuje spustiť kód aj manuálne tlačidlom

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4

      - name: Run script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py

      - name: Commit and push changes if state changed
        run: |
          git config --global user.name "Alza Price Bot"
          git config --global user.email "bot@users.noreply.github.com"
          git add -A
          git commit -m "Auto-update products cache" || echo "No changes to commit"
          git push
          
    
